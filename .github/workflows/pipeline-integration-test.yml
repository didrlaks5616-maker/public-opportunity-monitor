name: Pipeline Integration Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pipeline-integration-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      RUN_MODE: daily
      DRY_RUN: "false"
      LOOKBACK_DAYS: "1"
      MAX_PAGES: "1"
      TARGET_YEAR: "2026"
      LOG_LEVEL: INFO
      NOTION_WORKERS: "1"
      DRY_RUN_SAMPLE: "10"
      G2B_KINDS: "용역"
      ALLOW_G2B_OFF_HOURS: "true"
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
      NOTION_VERSION: "2026-03-11"
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
      BIZINFO_API_URL: https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do
      NOTIFICATION_TYPE: NONE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run limited live pipeline for services only
        run: python run_monitor.py
