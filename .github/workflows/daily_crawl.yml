name: Public Opportunity Monitor

on:
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch:
    inputs:
      RUN_MODE:
        description: "실행 모드"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - initial
      DRY_RUN:
        description: "Notion에 실제 반영하지 않고 결과만 확인"
        required: true
        default: true
        type: boolean
      LOOKBACK_DAYS:
        description: "daily 모드 조회 기간(일)"
        required: true
        default: "3"
        type: string
      MAX_PAGES:
        description: "API별 최대 페이지 수(페이지당 100건)"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      RUN_MODE: ${{ inputs.RUN_MODE || 'daily' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.DRY_RUN || 'false' }}
      LOOKBACK_DAYS: ${{ inputs.LOOKBACK_DAYS || '3' }}
      MAX_PAGES: ${{ inputs.MAX_PAGES || '10' }}
      TARGET_YEAR: "2026"
      LOG_LEVEL: INFO
      NOTION_WORKERS: "1"
      DRY_RUN_SAMPLE: "30"
      G2B_KINDS: "용역,공사,물품"
      ALLOW_G2B_OFF_HOURS: "true"
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
      NOTION_VERSION: "2026-03-11"
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
      BIZINFO_API_URL: https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do
      NOTIFICATION_TYPE: ${{ secrets.NOTIFICATION_TYPE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Show run configuration
        run: |
          echo "RUN_MODE=$RUN_MODE"
          echo "DRY_RUN=$DRY_RUN"
          echo "LOOKBACK_DAYS=$LOOKBACK_DAYS"
          echo "MAX_PAGES=$MAX_PAGES"
          echo "G2B_KINDS=$G2B_KINDS"
          echo "ALLOW_G2B_OFF_HOURS=$ALLOW_G2B_OFF_HOURS"
          echo "NOTION_WORKERS=$NOTION_WORKERS"
      - name: Run monitor
        run: python run_monitor.py
