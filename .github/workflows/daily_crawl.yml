name: Public Opportunity Monitor

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      DRY_RUN: "false"
      LOOKBACK_DAYS: "258"
      MAX_PAGES: "100"
      TARGET_YEAR: "2026"
      REQUEST_TIMEOUT: "30"
      LOG_LEVEL: INFO
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
      NOTION_VERSION: "2026-03-11"
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
      BIZINFO_API_URL: https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do
      NOTIFICATION_TYPE: ${{ secrets.NOTIFICATION_TYPE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run monitor
        run: python main.py
